apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

react { jsRootDir = file('../src/specs'); libraryName = 'GalinumJournalSpec'; codegenJavaPackageName = 'com.galinum.journal' }
android {
  namespace 'com.galinum.journal'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
  defaultConfig { minSdk 23 }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'net.zetetic:sqlcipher-android:4.17.0'
  implementation 'androidx.sqlite:sqlite:2.6.2'
}
