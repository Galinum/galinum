name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Start isolated loopback PostgreSQL
        run: |
          docker run --detach --network host --name galinum-product-postgres \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=galinum_product_ci \
            postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675 \
            -p 55432
          for attempt in {1..30}; do
            if docker exec galinum-product-postgres pg_isready --host=127.0.0.1 --port=55432 --username=postgres --dbname=postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs galinum-product-postgres
          exit 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @galinum/contracts build
      - run: pnpm verify:mobile-contracts
      - run: pnpm verify:workspace
      - run: pnpm verify:server-operations
      - run: pnpm verify:product-schema
      - name: Apply the product schema
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/galinum_product_ci
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/server/schema.sql
      - run: pnpm --filter @galinum/core build && pnpm --filter @galinum/push build
      - name: Run Postgres product integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/galinum_product_ci
          RUN_DB_INTEGRATION: "1"
        run: pnpm --filter @galinum/server test
      - name: Verify the existing database upgrade
        env:
          GALINUM_UPGRADE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
        run: pnpm verify:activation-upgrade
      - run: pnpm test
      - run: pnpm verify:affected -- --base "${{ github.event.before }}"
      - name: Verify the built activation runtime
        env:
          GALINUM_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
        run: |
          pnpm --filter @galinum/server... build
          pnpm verify:activation-runtime
      - run: pnpm verify:clean-clone
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm --force galinum-product-postgres
